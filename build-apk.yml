# ============================================================
# 旅行伴侣 - Android APK 云端自动打包工作流
# 
# 使用方法：
#   1. 把项目推送到 GitHub 仓库
#   2. 进入仓库的 Actions 标签页
#   3. 点击 "Build Android APK" → "Run workflow"
#   4. 等待5-10分钟
#   5. 在运行记录中下载生成的 APK
# ============================================================
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名称（中文）'
        required: false
        default: '旅行伴侣'
      app_id:
        description: '应用包名（如 com.tripmate.app）'
        required: false
        default: 'com.tripmate.app'

jobs:
  build-android-apk:
    name: 🤖 构建 Android APK
    runs-on: ubuntu-latest
    
    steps:
      # ==== 步骤1：检出代码 ====
      - name: 📥 检出代码
        uses: actions/checkout@v4
        
      # ==== 步骤2：设置 Node.js ====
      - name: 🔧 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # ==== 步骤3：设置 Java JDK ====
      - name: ☕ 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # ==== 步骤4：设置 Android SDK ====
      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3
        
      # ==== 步骤5：安装 Node 依赖 ====
      - name: 📦 安装 Node.js 依赖
        run: |
          npm install --save-dev serve
          npm install @capacitor/core@latest
          npm install @capacitor/cli@latest
          
      # ==== 步骤6：安装 Capacitor Android 平台 ====
      - name: 📱 安装 Capacitor Android 平台
        run: |
          npx cap init "${{ github.event.inputs.app_name || '旅行伴侣' }}" "${{ github.event.inputs.app_id || 'com.tripmate.app' }}" --webDir=. --no-telemetry
          npx cap add android --no-telemetry
          
      # ==== 步骤7：同步 Web 代码到 Android 项目 ====
      - name: 🔄 同步 Web 代码
        run: npx cap copy android --no-telemetry
        
      # ==== 步骤8：构建 APK ====
      - name: 🔨 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      # ==== 步骤9：上传 APK ====
      - name: 📤 上传 APK 到构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 旅行伴侣-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
      # ==== 步骤10：上传 AAB（Google Play 格式）====
      - name: 📤 上传 AAB 到构建产物
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 旅行伴侣-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
          retention-days: 30
          
      # ==== 完成通知 ====
      - name: ✅ 构建完成
        run: |
          echo "=========================================="
          echo "   ✅ APK 构建完成！"
          echo "=========================================="
          echo ""
          echo "下载 APK："
          echo "  1. 进入本页面顶部"
          echo "  2. 点击 '旅行伴侣-APK' 即可下载"
          echo ""
          echo "APK 文件路径："
          echo "  android/app/build/outputs/apk/debug/app-debug.apk"
